<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - PremiumStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Assets/css/style.css">
    <style>
        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        @media (min-width: 900px) {
            .details-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .product-img-large {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 24px;
            overflow: hidden;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .product-img-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .details-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--container-radius);
            padding: 30px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .details-title {
            font-size: 2rem;
            font-weight: 700;
        }
        .price-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .price-usd {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .price-naira {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .description-box {
            border-left: 4px solid var(--accent);
            padding-left: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .item-option-card {
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s;
        }
        .item-option-card.active {
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.05);
        }
        .item-option-name {
            font-weight: 700;
        }
        .item-option-price {
            color: var(--accent);
            font-weight: 600;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: var(--btn-radius);
            border: none;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <button id="themeToggleBtn" class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo">
                <span>PremiumStore</span>
            </a>
            <nav class="nav-links">
                <a href="index.html"><i class="fas fa-home"></i> Home</a>
                <a href="order-history.html"><i class="fas fa-box-open"></i> Orders</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="details-grid" id="productDetailsContainer">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>Developed by Abdullha Khan 💻</p></div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="Assets/js/firebase-config.js"></script>
    <script src="Assets/js/product-details.js"></script>
</body>
</html>
