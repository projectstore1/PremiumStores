<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - PremiumStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Assets/css/style.css">
    <style>
        .confirmation-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--container-radius);
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .success-icon {
            font-size: 4rem;
            color: var(--success);
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-in-out;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .link-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .link-input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .share-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .btn-social {
            padding: 10px 20px;
            border-radius: var(--btn-radius);
            color: white;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-telegram { background: #229ED9; }
        .btn-whatsapp { background: #25D366; }
    </style>
</head>
<body>
    <button id="themeToggleBtn" class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo">
                <span>PremiumStore</span>
            </a>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="confirmation-card">
                <div class="success-icon"><i class="fas fa-check-circle"></i></div>
                <h1 style="margin-bottom: 10px;">Order Confirmed! 🎉</h1>
                <p style="color: var(--text-secondary); margin-bottom: 25px;">Your order has been placed successfully and is pending verification.</p>
                
                <div class="link-box">
                    <input type="text" id="invoiceUrlInput" class="link-input" readonly>
                    <button id="copyLinkBtn" class="btn btn-success" style="flex: 0 0 100px; padding: 10px;">Copy</button>
                </div>

                <div class="share-btns">
                    <a id="telegramShare" href="#" target="_blank" class="btn-social btn-telegram"><i class="fab fa-telegram"></i> Telegram</a>
                    <a id="whatsappShare" href="#" target="_blank" class="btn-social btn-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <a id="viewInvoiceBtn" href="#" class="btn btn-success" style="flex: 1;"><i class="fas fa-file-invoice"></i> View Invoice</a>
                    <a href="index.html" class="btn btn-secondary" style="flex: 1;"><i class="fas fa-home"></i> Home</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>Developed by Abdullha Khan 💻</p></div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="Assets/js/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const htmlEl = document.documentElement;
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const savedTheme = localStorage.getItem('theme') || 'light';
            htmlEl.setAttribute('data-theme', savedTheme);
            themeToggleBtn.addEventListener('click', () => {
                const t = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                htmlEl.setAttribute('data-theme', t);
                localStorage.setItem('theme', t);
            });

            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');
            if (!orderId) {
                window.location.href = 'index.html';
                return;
            }

            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const invoiceUrl = `${baseUrl}invoice.html?orderId=${orderId}`;

            document.getElementById('invoiceUrlInput').value = invoiceUrl;
            document.getElementById('viewInvoiceBtn').href = `invoice.html?orderId=${orderId}`;
            document.getElementById('telegramShare').href = `https://t.me/share/url?url=${encodeURIComponent(invoiceUrl)}&text=${encodeURIComponent('Check my PremiumStore invoice!')}`;
            document.getElementById('whatsappShare').href = `https://api.whatsapp.com/send?text=${encodeURIComponent('Check my PremiumStore invoice: ' + invoiceUrl)}`;

            document.getElementById('copyLinkBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(invoiceUrl);
                const btn = document.getElementById('copyLinkBtn');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 2000);
            });
        });
    </script>
</body>
</html>
