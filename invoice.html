<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - PremiumStore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Assets/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .action-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .invoice-card {
            background: #ffffff;
            color: #0b1a3a;
            border-radius: var(--container-radius);
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #eef2f9;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            display: inline-block;
        }
        .status-pending { background: rgba(234, 179, 8, 0.15); color: #ca8a04; }
        .status-completed, .status-delivered { background: rgba(34, 197, 94, 0.15); color: #16a34a; }
        .status-cancelled { background: rgba(220, 38, 38, 0.15); color: #dc2626; }
        
        .invoice-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .table th, .table td {
            padding: 12px;
            border-bottom: 1px solid #eef2f9;
            text-align: left;
        }
        .table th {
            font-weight: 700;
            background: #f8fafc;
        }
        .total-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .total-row.grand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            border-top: 1px solid #eef2f9;
            padding-top: 10px;
            margin-bottom: 0;
        }
        @media print {
            .action-bar, .site-header, .site-footer, .theme-toggle-btn {
                display: none !important;
            }
            body {
                background: white !important;
            }
            .invoice-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <button id="themeToggleBtn" class="theme-toggle-btn"><i class="fas fa-moon"></i></button>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo">
                <span>PremiumStore</span>
            </a>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="action-bar" id="actionBar">
                <button onclick="window.print()" class="btn btn-secondary" style="flex:0 0 auto;"><i class="fas fa-print"></i> Print</button>
                <button id="downloadPdfBtn" class="btn btn-secondary" style="flex:0 0 auto;"><i class="fas fa-download"></i> Download PDF</button>
                <button id="copyLinkBtn" class="btn btn-secondary" style="flex:0 0 auto;"><i class="fas fa-copy"></i> Copy Link</button>
                <a href="index.html" class="btn btn-success" style="flex:0 0 auto;"><i class="fas fa-home"></i> Home</a>
            </div>

            <div class="invoice-card" id="invoiceCardContent">
                <div style="text-align: center; padding: 40px; color: #4a5a7a;">Loading Invoice...</div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container"><p>Developed by Abdullha Khan 💻</p></div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="Assets/js/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const htmlEl = document.documentElement;
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const savedTheme = localStorage.getItem('theme') || 'light';
            htmlEl.setAttribute('data-theme', savedTheme);
            themeToggleBtn.addEventListener('click', () => {
                const t = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                htmlEl.setAttribute('data-theme', t);
                localStorage.setItem('theme', t);
            });

            const urlParams = new URLSearchParams(window.location.search);
            const orderIdParam = urlParams.get('orderId');
            if (!orderIdParam) {
                document.getElementById('invoiceCardContent').innerHTML = '<p>Invalid Invoice URL.</p>';
                return;
            }

            try {
                const snapshot = await db.collection('invoices').where('orderId', '==', Number(orderIdParam)).get();
                if (snapshot.empty) {
                    document.getElementById('invoiceCardContent').innerHTML = '<p>Invoice not found.</p>';
                    return;
                }

                const invoice = snapshot.docs[0].data();
                const statusClass = `status-${invoice.status || 'pending'}`;
                const dateStr = invoice.createdAt ? invoice.createdAt.toDate().toLocaleString() : new Date().toLocaleString();

                document.getElementById('invoiceCardContent').innerHTML = `
                    <div class="invoice-header">
                        <div>
                            <div class="logo" style="margin-bottom: 10px;">
                                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo" style="width:30px;height:30px;">
                                <span>PremiumStore</span>
                            </div>
                            <p style="color: #64748b; font-size: 0.9rem;">Digital Subscriptions & Services</p>
                        </div>
                        <div style="text-align: right;">
                            <h2 style="font-size: 1.5rem; margin-bottom: 5px;">INVOICE</h2>
                            <p style="color: #64748b; font-weight: 600;">INV-${invoice.orderId}</p>
                            <span class="status-badge ${statusClass}" style="margin-top: 8px;">${invoice.status}</span>
                        </div>
                    </div>

                    <div class="invoice-details-grid">
                        <div>
                            <h4 style="margin-bottom: 8px; color: #64748b;">Customer Information</h4>
                            <p><strong>${invoice.userFieldLabel || 'Username'}:</strong> ${invoice.userInfo}</p>
                            <p><strong>Payment Method:</strong> ${invoice.paymentMethod || 'Crypto'}</p>
                        </div>
                        <div style="text-align: right;">
                            <h4 style="margin-bottom: 8px; color: #64748b;">Order Details</h4>
                            <p><strong>Date:</strong> ${dateStr}</p>
                            <p><strong>Order ID:</strong> #${invoice.orderId}</p>
                        </div>
                    </div>

                    <table class="table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Plan</th>
                                <th style="text-align: right;">Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${invoice.productName}</td>
                                <td>${invoice.plan}</td>
                                <td style="text-align: right;">$${Number(invoice.price).toFixed(2)}</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="total-box">
                        <div class="total-row">
                            <span>Subtotal:</span>
                            <span>$${Number(invoice.price).toFixed(2)}</span>
                        </div>
                        <div class="total-row">
                            <span>Naira Equivalent:</span>
                            <span>₦${invoice.nairaPrice ? invoice.nairaPrice.toLocaleString() : (invoice.price * 1440).toLocaleString()}</span>
                        </div>
                        <div class="total-row grand">
                            <span>Total Amount:</span>
                            <span>$${Number(invoice.price).toFixed(2)}</span>
                        </div>
                    </div>

                    <div style="text-align: center; color: #64748b; font-size: 0.9rem; border-top: 1px solid #eef2f9; padding-top: 20px;">
                        <p style="margin-bottom: 5px;">Thank you for shopping with PremiumStore!</p>
                        <p>Developed by Abdullha Khan 💻</p>
                    </div>
                `;

                document.getElementById('downloadPdfBtn').addEventListener('click', () => {
                    const element = document.getElementById('invoiceCardContent');
                    const opt = {
                        margin: 10,
                        filename: `Invoice-INV-${invoice.orderId}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2 },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };
                    html2pdf().from(element).set(opt).save();
                });

                document.getElementById('copyLinkBtn').addEventListener('click', () => {
                    navigator.clipboard.writeText(window.location.href);
                    alert('Invoice link copied to clipboard!');
                });

            } catch (error) {
                console.error('Error loading invoice:', error);
                document.getElementById('invoiceCardContent').innerHTML = '<p>Error loading invoice data.</p>';
            }
        });
    </script>
</body>
</html>
